services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: puvistoreable-webserver:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network


    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # ROOT
      - "traefik.http.routers.puvistoreable.rule=Host(`puvistoreable.web.id`)"
      - "traefik.http.routers.puvistoreable.entrypoints=web"
      - "traefik.http.routers.puvistoreable.service=puvistoreable"

      # WILDCARD
      - "traefik.http.routers.puvistoreable-wildcard.rule=HostRegexp(`^.+\\.puvistoreable\\.web\\.id$`)"
      - "traefik.http.routers.puvistoreable-wildcard.entrypoints=web"
      - "traefik.http.routers.puvistoreable-wildcard.service=puvistoreable"

      # SERVICE
      - "traefik.http.services.puvistoreable.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
