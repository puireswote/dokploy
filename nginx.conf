# ==========================================
# PUVISTOREABLE — static site host
# ==========================================
# One nginx instance serves both the main site and the per-template
# subdomains. Traefik (Dokploy) forwards any Host matching
# puvistoreable.web.id or *.puvistoreable.web.id here; nginx picks the
# document root from the Host header.

map $host $site_root {
    hostnames;

    # ROOT
    puvistoreable.web.id                 /usr/share/nginx/html/main_website;

    # TEMPLATE SUBDOMAINS (sub_website/<TIER>/<folder>)
    berry-pinkies.puvistoreable.web.id   /usr/share/nginx/html/sub_website/GOLD/berry-pinkies;
    blue-moonlit.puvistoreable.web.id    /usr/share/nginx/html/sub_website/GOLD/blue-moonlit;
    green-floral.puvistoreable.web.id    /usr/share/nginx/html/sub_website/GOLD/green-floral;
    lany-theme.puvistoreable.web.id      /usr/share/nginx/html/sub_website/GOLD/lany-album;
    mini-anniversary.puvistoreable.web.id /usr/share/nginx/html/sub_website/SILVER/mini-floral-anniversary;
    mini-spidey.puvistoreable.web.id     /usr/share/nginx/html/sub_website/SILVER/mini-spidey-lanyard;
    mini-spidergwen.puvistoreable.web.id /usr/share/nginx/html/sub_website/SILVER/mini-spidergwen-pink;

    # Unmapped subdomains fall back to the main site (graceful 404-avoidance).
    default                              /usr/share/nginx/html/main_website;
}

server {
    listen 80;
    listen [::]:80;
    server_name puvistoreable.web.id *.puvistoreable.web.id;

    root $site_root;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Fast static file serving
    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=5m;
    open_file_cache_valid 2m;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compression (text only; images/font formats are already compressed)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf font/otf font/woff font/woff2;


    # HTML: always revalidate
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # Static assets: cache long
    location ~* \.(?:css|js|svg|png|jpe?g|webp|gif|ico|ttf|otf|woff2?)$ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
}
