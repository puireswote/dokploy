server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Semua URL dicari di main_website dulu (situs utama: halaman + aset jalan normal)
    # Kalau tidak ada, baru dicari di sub_website/<nama-folder>
    # contoh: /demo        -> sub_website/demo/
    #         /demo/foto   -> sub_website/demo/foto
    root /usr/share/nginx/html/main_website;
    index index.html;

    location / {
        try_files $uri $uri/ @sub_website;
    }

    location @sub_website {
        root /usr/share/nginx/html/sub_website;
        try_files $uri $uri/ =404;
    }
}
